<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview - Command Center</title><style>
:root{color-scheme:dark;font:14px monospace}*{box-sizing:border-box}body{margin:0;background:#100d20;color:#e4efff}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px;border-bottom:1px solid #9664ed}button,a,select{background:#211936;color:#e4efff;border:1px solid #9664ed;padding:7px}label{display:flex;align-items:center;gap:5px}#viewport{position:absolute;inset:105px 0 0;overflow:auto;background-color:#151322;background-image:linear-gradient(45deg,#242033 25%,transparent 25%),linear-gradient(-45deg,#242033 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#242033 75%),linear-gradient(-45deg,transparent 75%,#242033 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}#extent{position:relative;margin:auto}iframe{border:0;display:block;transform-origin:top left;image-rendering:pixelated}#source{font-size:11px;overflow-wrap:anywhere;max-width:100%}p{padding:0 10px;margin:8px 0}body.editor #viewport{inset:105px 0 0}body.editor #extent,body.editor iframe{width:100%!important;height:100%!important;transform:none!important}
</style></head><body><header><strong id="title">LIVE PREVIEW</strong><button id="fit">Fit window</button><button id="native">100% native</button><label>Zoom <input id="zoom" type="range" min="25" max="400" value="100" step="5"><output id="percent">100%</output></label><label>Background <select id="background"><option value="checker">Checkerboard</option><option value="#100d20">Dark</option><option value="#ffffff">White</option><option value="#00ff00">Green</option></select></label><button id="reload">Refresh</button><button id="fullscreen">Fullscreen</button><a id="editor" target="_blank">Open editor</a><a id="clean" target="_blank">Clean OBS source</a></header><p id="source"></p><div id="viewport"><div id="extent"><iframe id="output" title="Popped-out live preview"></iframe></div></div><script type="module" src="/preview-window.js"></script></body></html>
